[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
version = "3.0.0"
description = "Self-hosted network scanner and traffic monitor with plain-English alerts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["Flask>=3.0,<4", "waitress>=3.0"]

[project.optional-dependencies]
capture = ["scapy>=2.5"]

[project.scripts]
netsentinel = "netsentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["netsentinel*"]

[tool.setuptools.package-data]
netsentinel = ["web/templates/*.html", "web/static/*"]
